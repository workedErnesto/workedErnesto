<svg xmlns="http://www.w3.org/2000/svg" width="380" height="305.58" viewBox="0 0 480 386" role="img"><title>mica: браузер для macOS и Windows: вкладки, локальные данные, расширения и блокировка рекламы и трекеров. macOS: независимое MicaCore и оболочка AppKit / SwiftUI поверх WebKit. Windows: C# / .NET, WinUI 3 и WebView2. Общие токены, строки и тестовые данные.</title><rect x=".5" y=".5" width="479" height="377" rx="8" fill="#171717" stroke="#2f2f2f"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="24" y="24" dominant-baseline="hanging" fill="#f5f5f5" font-size="25" font-weight="650">mica</text><text x="24" y="62" dominant-baseline="hanging" fill="#a3a3a3" font-size="12" letter-spacing="1.5">Open source</text><text x="24" y="94" dominant-baseline="hanging" fill="#ececec" font-size="16">браузер для macOS и Windows: вкладки,</text><text x="24" y="117" dominant-baseline="hanging" fill="#ececec" font-size="16">локальные данные, расширения и блокировка</text><text x="24" y="140" dominant-baseline="hanging" fill="#ececec" font-size="16">рекламы и трекеров.</text><text x="24" y="185" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">macOS: независимое MicaCore и оболочка AppKit</text><text x="24" y="208" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">/ SwiftUI поверх WebKit. Windows: C# / .NET,</text><text x="24" y="231" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">WinUI 3 и WebView2. Общие токены, строки и</text><text x="24" y="254" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">тестовые данные.</text><text x="24" y="301" dominant-baseline="hanging" fill="#ececec" font-size="14" font-weight="600">Swift / C# / .NET / JavaScript</text><text x="24" y="337" dominant-baseline="hanging" fill="#f5f5f5" font-size="15">исходники →</text></g></svg>