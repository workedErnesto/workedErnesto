<svg xmlns="http://www.w3.org/2000/svg" width="393" height="305.84" viewBox="0 0 496 386" role="img"><title>rotide.dm: редактор и читалка Markdown для macOS и Windows. Предпросмотр GitHub, экспорт в HTML, PDF, Word и RTF. 4 пакета: чистое Dart-ядро, UI kit, нативный мост и приложение. cmark-gfm через FFI, сборка build hook'ом. WKWebView на macOS, WebView2 на Windows.</title><rect x=".5" y=".5" width="479" height="377" rx="8" fill="#fff" stroke="#dddddd"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="24" y="24" dominant-baseline="hanging" fill="#262626" font-size="25" font-weight="650">rotide.dm</text><text x="24" y="62" dominant-baseline="hanging" fill="#666666" font-size="12" letter-spacing="1.5">Open source</text><text x="24" y="94" dominant-baseline="hanging" fill="#1c1c1c" font-size="16">редактор и читалка Markdown для macOS и</text><text x="24" y="117" dominant-baseline="hanging" fill="#1c1c1c" font-size="16">Windows. Предпросмотр GitHub, экспорт в HTML,</text><text x="24" y="140" dominant-baseline="hanging" fill="#1c1c1c" font-size="16">PDF, Word и RTF.</text><text x="24" y="185" dominant-baseline="hanging" fill="#666666" font-size="16">4 пакета: чистое Dart-ядро, UI kit, нативный</text><text x="24" y="208" dominant-baseline="hanging" fill="#666666" font-size="16">мост и приложение. cmark-gfm через FFI,</text><text x="24" y="231" dominant-baseline="hanging" fill="#666666" font-size="16">сборка build hook'ом. WKWebView на macOS,</text><text x="24" y="254" dominant-baseline="hanging" fill="#666666" font-size="16">WebView2 на Windows.</text><text x="24" y="301" dominant-baseline="hanging" fill="#1c1c1c" font-size="14" font-weight="600">Flutter / Dart / Swift</text><text x="24" y="337" dominant-baseline="hanging" fill="#262626" font-size="15">исходники →</text></g></svg>