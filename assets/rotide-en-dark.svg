<svg xmlns="http://www.w3.org/2000/svg" width="393" height="305.84" viewBox="0 0 496 386" role="img"><title>rotide.dm: Markdown reader and editor for macOS and Windows. GitHub-style preview; HTML, PDF, Word and RTF export. 4 packages: pure Dart core, UI kit, native bridge and app. cmark-gfm via FFI, built by a build hook. WKWebView on macOS, WebView2 on Windows.</title><rect x=".5" y=".5" width="479" height="377" rx="8" fill="#171717" stroke="#2f2f2f"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="24" y="24" dominant-baseline="hanging" fill="#f5f5f5" font-size="25" font-weight="650">rotide.dm</text><text x="24" y="62" dominant-baseline="hanging" fill="#a3a3a3" font-size="12" letter-spacing="1.5">Open source</text><text x="24" y="94" dominant-baseline="hanging" fill="#ececec" font-size="16">Markdown reader and editor for macOS and</text><text x="24" y="117" dominant-baseline="hanging" fill="#ececec" font-size="16">Windows. GitHub-style preview; HTML, PDF,</text><text x="24" y="140" dominant-baseline="hanging" fill="#ececec" font-size="16">Word and RTF export.</text><text x="24" y="185" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">4 packages: pure Dart core, UI kit, native</text><text x="24" y="208" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">bridge and app. cmark-gfm via FFI, built</text><text x="24" y="231" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">by a build hook. WKWebView on macOS,</text><text x="24" y="254" dominant-baseline="hanging" fill="#a3a3a3" font-size="16">WebView2 on Windows.</text><text x="24" y="301" dominant-baseline="hanging" fill="#ececec" font-size="14" font-weight="600">Flutter / Dart / Swift</text><text x="24" y="337" dominant-baseline="hanging" fill="#f5f5f5" font-size="15">source code →</text></g></svg>